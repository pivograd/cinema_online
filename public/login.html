<div class="scene" aria-hidden="true"></div>

<main class="entry">
  <h1 class="sr-only">Вход</h1>
  <form class="login" method="post" action="/login">
    <div class="field">
      <label for="user">Логин</label>
      <input class="input" id="user" name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required aria-describedby="err">
    </div>
    <div class="field">
      <label for="password">Пароль</label>
      <div class="pass">
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="err">
        <button class="reveal" type="button" id="reveal" aria-label="Показать пароль" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-eye"/></svg></button>
      </div>
    </div>
    <p class="error" id="err" role="alert" hidden></p>
    <button class="btn" type="submit"><span class="lamp" aria-hidden="true"></span><span class="lbl">Войти</span></button>
    <p class="hint">Логин и пароль даёт тот, кто прислал ссылку. Вход запомнится на этом устройстве на месяц.</p>
  </form>
</main>
